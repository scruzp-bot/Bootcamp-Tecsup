name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy de la API
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_API }}"
      - name: Deploy de la interfaz
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_UI }}"
