name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Datos
        run: uv run datos
      - name: Entrenamiento (con puerta de calidad)
        run: uv run entrenar
      - name: Pruebas
        run: uv run pytest -v
      - name: Guardar modelo y metricas
        uses: actions/upload-artifact@v4
        with:
          name: modelo
          path: models/
